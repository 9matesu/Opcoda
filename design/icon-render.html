<!doctype html>
<html><head><meta charset="utf-8"><title>ícones</title>
<style>html,body{margin:0;background:#333;display:flex;gap:20px;padding:20px;align-items:flex-start}
canvas{background:#555}</style></head>
<body>
<script>
const sizes=[32,256,512];
const img=new Image();
img.onload=()=>{
  for(const size of sizes){
    const c=document.createElement('canvas');
    c.width=size;c.height=size;
    const g=c.getContext('2d');
    // fundo: o mesmo graphite do chassis, com raio de 22 % do lado
    const r=size*0.22;
    g.beginPath();
    g.moveTo(r,0);g.lineTo(size-r,0);g.quadraticCurveTo(size,0,size,r);
    g.lineTo(size,size-r);g.quadraticCurveTo(size,size,size-r,size);
    g.lineTo(r,size);g.quadraticCurveTo(0,size,0,size-r);
    g.lineTo(0,r);g.quadraticCurveTo(0,0,r,0);g.closePath();
    g.fillStyle='#1b1b1d';g.fill();
    // a marca ocupa 62 % do lado, centrada
    const side=size*0.62, o=(size-side)/2;
    g.drawImage(img,o,o,side,side);
    document.body.appendChild(c);
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    a.download='opcoda-icon-'+size+'.png';
    document.body.appendChild(a);
  }
  window.__ready=true;
};
img.src='../resources/brand/logo-light.svg';
</script>
</body></html>
